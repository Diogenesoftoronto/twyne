name: Writing instrument evaluations
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      real_models:
        description: Download pinned local packs and verify real browser inference
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/utils/**"
      - "src/components/editor/extensions/**"
      - "convex/instrument*"
      - "convex/knowledge*"
      - "convex/house*"
      - "convex/account*"
      - "convex/schema.ts"
      - "evals/instruments/**"
      - "prompts/**"
      - "src/generated/prompt-catalog.ts"
      - "scripts/compile-prompts.ts"
      - "package.json"
      - "e2e/instruments-models.e2e.ts"
      - "playwright.models.config.ts"
      - ".github/workflows/instrument-evals.yml"
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run prompts:check
      - run: bun run eval:instruments --strict-performance --max-p95-ms 250
      - name: Validate authored editor-routing corpus without model calls
        run: bun run eval:room-routing --output artifacts/instrument-evals/room-routing
      - name: Check contextual editor routing and exact-source handoffs
        run: |
          bun run i18n:prepare
          bun test --conditions=production --preload ./tests/qwik-test-preload.ts src/utils/instrument-room.test.ts src/utils/instrument-comment.test.ts src/utils/persona-portrait.test.ts src/utils/instrument-source.test.ts src/utils/user-comments.test.ts src/utils/prompts.test.ts src/utils/prompts-regression.test.ts src/components/editor/extensions/struggle-tracker.test.ts evals/instruments/room-routing.test.ts
      - name: Check hosted task, resource and ownership contracts
        run: bunx vitest run convex/instrumentTasks.test.ts convex/house.test.ts convex/account.test.ts convex/knowledge.test.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-eval-report
          path: artifacts/instrument-evals/
          retention-days: 30
  model-packs:
    if: github.event_name == 'workflow_dispatch' && inputs.real_models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: TWYNE_MODEL_DOWNLOADS=1 bun run test:models
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-real-model-report
          path: artifacts/instrument-evals/
          retention-days: 30
