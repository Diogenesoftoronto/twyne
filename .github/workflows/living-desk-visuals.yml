name: Writing instruments visual review

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "src/components/instruments/**"
      - "src/components/in-flow/**"
      - "src/utils/sentence-*"
      - "src/utils/span-index*"
      - "src/utils/thread-instrument*"
      - "src/utils/scene-bench*"
      - "src/utils/entity-instrument*"
      - "e2e/instruments.e2e.ts"
      - "e2e/instrument-dock.e2e.ts"
      - "e2e/manual-instruments.e2e.ts"
      - "e2e/fixtures/instruments.ts"
      - "src/components/living-desk/**"
      - "src/components/editor/extensions/living-desk*"
      - "src/components/editor/manuscript-panel.tsx"
      - "src/components/editor/compositor-panel.tsx"
      - "src/utils/living-desk*/**"
      - "src/utils/living-desk-contract.ts"
      - "src/routes/docs/**"
      - "public/assets/manual/living-desk*"
      - "public/assets/manual/living-desk/**"
      - "public/assets/manual/writing-instruments*"
      - "public/assets/manual/writing-instruments/**"
      - "public/assets/instruments/**"
      - "e2e/*living-desk*"
      - "e2e/fixtures/living-desk.ts"
      - "e2e/visual-baselines/**"
      - "playwright.visual.config.ts"
      - "playwright.manual.config.ts"
      - "server.js"
      - ".github/workflows/living-desk-visuals.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Check manuscript interactions and screenshots
        run: bun run test:visual
      - name: Check built manual and production video range handling
        run: bun run test:manual
      - name: Save footage, stills, traces and review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-desk-visual-review
          path: artifacts/qa-recordings/living-desk/
          retention-days: 30
