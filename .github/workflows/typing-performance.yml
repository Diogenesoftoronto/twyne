name: Editor typing performance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typing:
    name: Native typing · p95/p99 · charts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Measure editor latency and verify saved typing
        run: bun run test:typing
      - name: Upload latency data and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-typing-performance
          path: |
            test-results/
            playwright-report/
          retention-days: 30
      - name: Add chart download to job summary
        if: always()
        run: echo 'Typing reports include p50/p95/p99/max bar charts, latency histograms, raw samples, and browser/CPU metadata. Download **editor-typing-performance** from this run to inspect the standalone HTML or PNG charts.' >> "$GITHUB_STEP_SUMMARY"
