<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<title>Twyne — Sting</title><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="assets/twyne-base.css"/><style>
.lockup {position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mark {width:165px;height:165px;margin-bottom:30px}
.wm {display:flex;font-family:var(--display);font-weight:700;font-size:160px;line-height:1.1;letter-spacing:.08em;padding-left:.08em;margin:0}
.letter {display:inline-block}
.tag {font-family:var(--serif);font-style:italic;font-size:48px;line-height:1.35;color:var(--ink-light);margin-top:32px}
.url {font-family:var(--sans);font-size:36px;letter-spacing:.14em;color:#a51f24;margin-top:32px}
.rule {width:170px;height:4px;background:var(--vermilion);margin-top:30px;transform-origin:center}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080" data-fps="30">
<div class="paper-bg"></div><section id="scene-1" class="clip" data-start="0" data-duration="6" data-track-index="1"><div class="lockup"><img class="mark" id="mark" src="assets/img/griffin-red.svg" alt=""/><h1 class="wm" id="wm">TWYNE</h1><div class="tag" id="tag">Draft with a room full of editors.</div><div class="rule" id="rule"></div><div class="url" id="url">twyne.love</div></div></section>
<audio id="music" src="assets/audio/m-sting-cut.wav" data-start="0" data-duration="6" data-track-index="10" data-volume="1"></audio>
</div><script src="assets/js/twyne-kit.js"></script><script src="assets/js/words.js"></script><script>
const tl=gsap.timeline({paused:true});
const letters=TK.chars(document.querySelector("#wm"));letters.forEach(el=>el.classList.add("letter"));
// Registry logo-brand-close cascade, in the existing Twyne identity.
tl.fromTo("#mark",{opacity:0,y:20,scale:.92},{opacity:1,y:0,scale:1,duration:.9,ease:"power3.out"},.1);
tl.fromTo(letters,{opacity:0,y:70},{opacity:1,y:0,duration:1.15,stagger:{amount:.7},ease:"expo.out"},.45);
tl.fromTo("#wm",{scale:1.04},{scale:1,duration:2.4,ease:"expo.out"},.45);
tl.fromTo("#tag",{opacity:0,y:24},{opacity:1,y:0,duration:.9,ease:"power3.out"},1.6);
tl.fromTo("#rule",{scaleX:0},{scaleX:1,duration:.6,ease:"power2.out"},2.1);
tl.fromTo("#url",{opacity:0,scaleX:1.06},{opacity:1,scaleX:1,duration:.85,ease:"power2.out"},2.4);
window.__timelines["main"]=tl;
</script></body></html>
